name: Build WhatsApp Companion APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android Permissions, Native 100% Mobile Scale & Back Button
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />#' "$FILE"

          MAIN_ACTIVITY=android/app/src/main/java/com/rayyan/waweb/MainActivity.java
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.rayyan.waweb;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.WebViewListener;

          public class MainActivity extends BridgeActivity {
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      Bridge bridge = this.getBridge();
                      if (bridge != null) {
                          WebView webView = bridge.getWebView();
                          if (webView != null) {
                              WebSettings settings = webView.getSettings();

                              // Lock to 100% native mobile scale (NO microscopic shrinking):
                              settings.setUseWideViewPort(true);
                              settings.setLoadWithOverviewMode(false);
                              webView.setInitialScale(100);

                              // Text at 100% native size
                              settings.setTextZoom(100);

                              // Allow pinch zoom if user desires, but default is 100% normal size
                              settings.setSupportZoom(true);
                              settings.setBuiltInZoomControls(true);
                              settings.setDisplayZoomControls(false);

                              settings.setDomStorageEnabled(true);
                              settings.setDatabaseEnabled(true);
                              settings.setJavaScriptEnabled(true);
                          }

                          // Inject responsive CSS & 1:1 mobile viewport so text and buttons are large and readable:
                          bridge.addWebViewListener(new WebViewListener() {
                              @Override
                              public void onPageLoaded(WebView webView) {
                                  String css = "html, body { width: 100% !important; min-width: 100% !important; overflow-x: hidden !important; }" +
                                               "#app, #app > div { min-width: unset !important; width: 100% !important; }" +
                                               "[data-ref], [data-testid='qrcode'] { max-width: 95vw !important; margin: 0 auto !important; }" +
                                               "#side { min-width: 100% !important; width: 100% !important; }" +
                                               "#main { min-width: 100% !important; width: 100% !important; }" +
                                               "div[role='button'], button { min-height: 44px !important; }";

                                  String js = "javascript:(function() {" +
                                      "var meta = null;" +
                                      "var metas = document.getElementsByTagName('meta');" +
                                      "for (var i = 0; i < metas.length; i++) {" +
                                      "  if (metas[i].name === 'viewport') { meta = metas[i]; break; }" +
                                      "}" +
                                      "if (!meta) {" +
                                      "  meta = document.createElement('meta');" +
                                      "  meta.name = 'viewport';" +
                                      "  document.head.appendChild(meta);" +
                                      "}" +
                                      "meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=2.5, user-scalable=yes';" +
                                      "var style = document.getElementById('wa-mobile-fix');" +
                                      "if (!style) {" +
                                      "  style = document.createElement('style');" +
                                      "  style.id = 'wa-mobile-fix';" +
                                      "  style.innerHTML = '" + css + "';" +
                                      "  document.head.appendChild(style);" +
                                      "}" +
                                      "})();";
                                  webView.evaluateJavascript(js, null);
                              }
                          });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView webView = this.getBridge() != null ? this.getBridge().getWebView() : null;
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WhatsApp-Companion-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Companion-APK-v1.0.2
          path: WhatsApp-Companion-v1.0.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "WhatsApp Companion v1.0.2 (Native 100% Mobile Scale - No Zoom Required)"
          body: "Direct 1-click APK download. Fixed microscopic zooming issue: Now rendered at 100% native mobile scale. Big readable text, large buttons, no pinch-to-zoom needed."
          files: WhatsApp-Companion-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
